events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Ocultar versão do Nginx por segurança
    server_tokens off;

    # Permitir uploads de vídeos e imagens até 500MB
    client_max_body_size 500M;

    sendfile on;
    keepalive_timeout 65;

    # Headers Globais de Segurança (Hardening HTTP & CSP)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://api.mercadopago.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.mercadopago.com https://*.r2.cloudflarestorage.com https:; frame-src 'self' https://www.youtube.com https://www.mercadopago.com.br;" always;

    # Rate Limiting (Proteção contra Brute-Force e DDoS)
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/s;
    limit_req_status 429;

    # Compressão Gzip para performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name tellax.online www.tellax.online admin.tellax.online _;

        # Suporte para validação do Certbot (SSL HTTPS)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Rate Limiting em rotas sensíveis de Autenticação e Login/Registro
        location ~* ^/(api/auth|login|admin/login|register) {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://telax_app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy Reverso Principal para o App Next.js
        location / {
            limit_req zone=general_limit burst=30 nodelay;
            proxy_pass http://telax_app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
